name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Assemble site
        run: |
          mkdir -p _site/icons _site/fonts _site/vendor
          cp index.html styles.css app.js alerts.js config.js db.js card-math.js projections.js combined.js backup.js privacy.js tarjeta.js planes.js proyeccion.js ring-layout.js statement-parser.js statement-classification.js service-categories.js recurring.js pdf-text.js ocr.js resumen.js fx.js theme.js money-view.js sw.js manifest.webmanifest favicon.ico _site/
          cp icons/* _site/icons/
          cp fonts/* _site/fonts/
          cp -a vendor/. _site/vendor/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
